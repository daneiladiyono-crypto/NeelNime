<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b111a">
<title>Neel.Nime</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b111a;--s:#141f33;--s2:#1c2a44;--ink:#f3f6fb;--mut:#8b97ad;--ac:#2d9bff;--yel:#ffd84a;--line:#2a3b5c}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html{color-scheme:dark}
body{background:var(--bg);color:var(--ink);font:400 16px/1.5 Rubik,system-ui,sans-serif;padding-bottom:calc(104px + env(safe-area-inset-bottom))}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
svg{width:1em;height:1em;fill:currentColor;flex:none}
:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
.app{max-width:720px;margin:0 auto}
header{background:#10171f;padding-top:env(safe-area-inset-top)}
.hd{padding:12px 16px 14px}
.logo{display:inline-block;font:600 1.5rem/1 Rubik;margin-bottom:12px}
.logo i{font-style:normal;color:var(--ac)}
.search{display:flex;align-items:center;gap:12px;background:var(--s2);border-radius:999px;padding:0 20px;height:52px}
.search svg{font-size:24px;color:var(--mut)}
.search input{flex:1;min-width:0;background:none;border:0;outline:0;color:var(--ink);font:inherit}
body.det header{display:none}
section{padding:20px 16px 0}
.sh{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
h2{font:500 1.5rem/1.2 Rubik}
.sh a,.lnk{color:var(--ac);font-weight:500}
.hs{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x proximity;padding-bottom:4px}
.hs::-webkit-scrollbar{display:none}
.hc{flex:0 0 78%;max-width:300px;scroll-snap-align:start}
.th{position:relative;aspect-ratio:16/9;border-radius:14px;overflow:hidden;background:var(--s)}
.th img{width:100%;height:100%;object-fit:cover;display:block}
.th:after,.poster:after{content:"";position:absolute;inset:45% 0 0;background:linear-gradient(transparent,rgba(0,0,0,.8))}
.hc h3{font:500 1rem/1.3 Rubik;margin:10px 0 2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px 10px}
.grid.two{grid-template-columns:repeat(2,1fr)}
.poster{position:relative;aspect-ratio:2/3;border-radius:14px;overflow:hidden;background:var(--s)}
.poster img{width:100%;height:100%;object-fit:cover;display:block}
.new{position:absolute;top:0;left:0;z-index:1;background:var(--ac);color:#fff;font-weight:600;padding:3px 14px 5px 12px;border-radius:0 0 14px 0}
.sc{position:absolute;top:0;right:0;z-index:1;display:flex;gap:3px;align-items:center;background:rgba(0,0,0,.6);font-weight:500;font-size:.85rem;padding:3px 10px;border-radius:0 0 0 12px}
.sc svg{color:#ffc83d}
.ep{position:absolute;left:10px;bottom:8px;z-index:1;font-weight:600}
.views{display:flex;gap:6px;align-items:center;color:var(--mut);font-size:.9rem;margin-top:8px}
.card h3{font:500 1rem/1.3 Rubik;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.hc .views{margin-top:0}
.msg{padding:22px;border:1px dashed var(--line);border-radius:14px;color:var(--mut);grid-column:1/-1}
.sk{animation:pulse 1.2s ease-in-out infinite}
.sk .poster{background:var(--s2)}
@keyframes pulse{50%{opacity:.45}}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:4px 16px 0}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;padding:8px 18px;border-radius:999px;background:var(--s2);font-weight:500}
.tab.on{background:var(--ac);color:#fff}
.banner{position:relative;min-height:min(76vh,560px);display:flex;flex-direction:column;justify-content:flex-end;background:linear-gradient(transparent 50%,var(--bg) 97%),linear-gradient(rgba(0,0,0,.45),transparent 28%),var(--img) center top/cover}
.top{position:absolute;top:0;left:0;right:0;display:flex;align-items:center;gap:12px;padding:calc(14px + env(safe-area-inset-top)) 16px 0}
.back{width:42px;height:42px;border-radius:50%;background:rgba(0,0,0,.4);display:grid;place-items:center;font-size:24px}
.top b{font-weight:600}
.bt{padding:0 20px 6px}
.bt small{color:#dfe5f1}
.bt h1{font:600 2rem/1.15 Rubik;margin:4px 0 14px}
.upd{display:flex;gap:8px;align-items:center;color:var(--yel);font-weight:500}
.pad{padding:0 20px}
.chips{display:flex;flex-wrap:wrap;gap:10px;margin:14px 0}
.chip{display:inline-flex;gap:6px;align-items:center;background:var(--s2);padding:7px 16px;border-radius:999px;font-weight:500;font-size:.95rem}
.chip svg{color:#ffc83d}
.out .chip{background:none;border:1.5px solid #2f6b99;padding:8px 18px;font-size:1rem}
.green{background:#1d3a2f;color:#8be0b0}
.btns{display:flex;gap:14px;margin:22px 0 4px}
.go,.subb{height:54px;border-radius:999px;display:flex;gap:10px;justify-content:center;align-items:center;font-weight:600}
.go{flex:1.5;background:linear-gradient(90deg,#33b0ff,#1673d8);color:#fff}
.subb{flex:1;background:var(--s2)}
.subb.on{color:var(--ac)}
.pad h2{margin:26px 0 12px}
.pad .sh h2{margin:0}
.pad>.sh{margin-top:26px}
.syn{color:#cfd6e4;line-height:1.7;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.syn.open{display:block}
.rc{flex:0 0 150px;background:var(--s);border-radius:16px;overflow:hidden}
.rc img{width:100%;aspect-ratio:6/7;object-fit:cover;display:block}
.rc p{padding:12px 14px;font-weight:500;font-size:.95rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tb{display:flex;gap:12px;margin-bottom:14px}
.tb input{flex:1;min-width:0;height:52px;border-radius:16px;border:2px solid var(--line);background:none;color:var(--ink);font:inherit;padding:0 18px;outline:0}
.tb input:focus{border-color:var(--ac)}
.tb button{width:52px;height:52px;border-radius:16px;background:var(--s2);display:grid;place-items:center;font-size:24px}
.tb .asc svg{transform:rotate(180deg)}
.el{display:grid;gap:12px}
.el.g2{grid-template-columns:repeat(2,1fr)}
.ei{display:flex;justify-content:space-between;align-items:center;gap:12px;background:#131d36;border-radius:18px;padding:18px 20px;text-align:left;width:100%}
.ei b{font:500 1.1rem Rubik;display:block}
.ei small{color:var(--mut);display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pl{width:40px;height:40px;border-radius:50%;background:#3a82e6;display:grid;place-items:center;font-size:22px;flex:none}
nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:#0d131c;border-top:1px solid #172133;padding:8px 8px calc(8px + env(safe-area-inset-bottom))}
.ni{max-width:720px;margin:0 auto;display:flex;justify-content:space-around;align-items:center}
.ni a{display:flex;flex-direction:column;align-items:center;gap:2px;padding:12px 22px;border-radius:28px;font-size:28px;color:#dfe5f1}
.ni a span{display:none;font-size:.8rem;font-weight:600}
.ni a.on{background:#3b3868;padding:10px 28px 8px}
.ni a.on span{display:block}
dialog{margin:auto auto 0;width:min(720px,100%);max-width:100%;max-height:90vh;border:0;border-radius:24px 24px 0 0;background:var(--s);color:var(--ink);padding:0}
dialog::backdrop{background:rgba(0,0,0,.65)}
.sb{padding:20px;overflow:auto;max-height:90vh}
.stop{display:flex;justify-content:space-between;gap:12px;margin-bottom:14px}
.stop h2{font-size:1.3rem}
.x{width:38px;height:38px;border-radius:50%;background:var(--s2);flex:none}
.vid{aspect-ratio:16/9;border-radius:14px;overflow:hidden;background:#000;margin-bottom:14px}
.vid iframe{width:100%;height:100%;border:0}
.note{color:var(--mut);margin-bottom:12px}
.links{display:flex;flex-wrap:wrap;gap:10px;padding-bottom:10px}
.links a{background:var(--ac);color:#fff;padding:10px 20px;border-radius:999px;font-weight:500}
.links a.alt{background:var(--s2)}
@media(min-width:700px){.app{max-width:1000px}.grid{grid-template-columns:repeat(5,1fr)}.grid.two{grid-template-columns:repeat(4,1fr)}.ni{max-width:1000px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
<header><div class="app hd">
  <a class="logo" href="#/">Neel<i>.Nime</i></a>
  <form class="search" id="sf" role="search"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15.5 14h-.79l-.28-.27A6.47 6.47 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg><input id="q" type="search" placeholder="Mencari anime" aria-label="Mencari anime" autocomplete="off"></form>
</div></header>
<main class="app" id="app"></main>
<nav><div class="ni" id="nav"></div></nav>
<dialog id="sheet"><div class="sb" id="sb"></div></dialog>

<script>
const API="https://api.jikan.moe/v4";
const $=s=>document.querySelector(s),app=$("#app");
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const ls={get:(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}},set:(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch{}}};
const P={home:"M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z",cal:"M19 4h-1V2h-2v2H8V2H6v2H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2zm0 16H5V9h14v11zM7 11h4v4H7z",lib:"M4 6H2v14c0 1.1.9 2 2 2h14v-2H4V6zm16-4H8c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm-8 12.5v-9l6 4.5-6 4.5z",hist:"M13 3a9 9 0 0 0-9 9H1l3.89 3.89.07.14L9 12H6c0-3.87 3.13-7 7-7s7 3.13 7 7-3.13 7-7 7c-1.93 0-3.68-.79-4.94-2.06l-1.42 1.42A8.954 8.954 0 0 0 13 21a9 9 0 0 0 0-18zm-1 5v5l4.28 2.54.72-1.21-3.5-2.08V8H12z",trend:"M16 6l2.29 2.29-4.88 4.88-4-4L2 16.59 3.41 18l6-6 4 4 6.3-6.29L22 12V6z",play:"M8 5v14l11-7z",star:"M12 17.27 18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z",back:"M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z",bell:"M12 22a2 2 0 0 0 2-2h-4a2 2 0 0 0 2 2zm6-6v-5c0-3.07-1.63-5.64-4.5-6.32V4a1.5 1.5 0 0 0-3 0v.68C7.64 5.36 6 7.92 6 11v5l-2 2v1h16v-1l-2-2z",clock:"M11.99 2C6.47 2 2 6.48 2 12s4.47 10 9.99 10C17.52 22 22 17.52 22 12S17.52 2 11.99 2zM12 20c-4.42 0-8-3.58-8-8s3.58-8 8-8 8 3.58 8 8-3.58 8-8 8zm.5-13H11v6l5.25 3.15.75-1.23-4.5-2.67V7z",down:"M7.41 8.59 12 13.17l4.59-4.58L18 10l-6 6-6-6z",grid:"M3 3h8v8H3V3zm10 0h8v8h-8V3zM3 13h8v8H3v-8zm10 0h8v8h-8v-8z",list:"M3 13h2v-2H3v2zm0 4h2v-2H3v2zm0-8h2V7H3v2zm4 4h14v-2H7v2zm0 4h14v-2H7v2zM7 7v2h14V7H7z"};
const I=Object.fromEntries(Object.entries(P).map(([k,v])=>[k,`<svg viewBox="0 0 24 24" aria-hidden="true"><path d="${v}"/></svg>`]));

let last=Promise.resolve(),rid=0,cur=null,eps=[],est={q:"",desc:true,g:false};
const cache=new Map();
function api(path){
  if(cache.has(path))return cache.get(path);
  const p=last.then(async()=>{
    for(let i=0;i<4;i++){
      const r=await fetch(API+path);
      if(r.status===429){await sleep(1200);continue}
      if(!r.ok)throw new Error("HTTP "+r.status);
      const j=await r.json();await sleep(380);return j;
    }
    throw new Error("Terlalu banyak permintaan");
  });
  last=p.catch(()=>{});cache.set(path,p);p.catch(()=>cache.delete(path));return p;
}
const kfmt=n=>n>=1e6?(n/1e6).toFixed(1).replace(".0","")+"M":n>=1e3?(n/1e3).toFixed(1).replace(".0","")+"K":n;
const title=a=>a.title_english||a.title;
const img=a=>a.images?.webp?.large_image_url||a.images?.jpg?.large_image_url||"";
const DAYS={Mondays:"Senin",Tuesdays:"Selasa",Wednesdays:"Rabu",Thursdays:"Kamis",Fridays:"Jumat",Saturdays:"Sabtu",Sundays:"Minggu"};
function fdate(s){
  if(!s)return"Tanggal belum ada";
  const d=new Date(s),df=(Date.now()-d)/864e5;
  if(df>=0&&df<1)return"hari ini";if(df>=1&&df<2)return"kemarin";
  return d.toLocaleDateString("id-ID",{day:"numeric",month:"short",year:"numeric"});
}
const uniq=l=>{const s=new Set();return l.filter(a=>!s.has(a.mal_id)&&s.add(a.mal_id))};
const skel=n=>Array.from({length:n},()=>`<div class="card sk"><div class="poster"></div></div>`).join("");
const card=(a,badge)=>`<a class="card" href="#/anime/${a.mal_id}"><div class="poster"><img loading="lazy" src="${esc(img(a))}" alt="Poster ${esc(title(a))}">${badge?`<b class="new">New</b>`:""}${a.score?`<span class="sc">${I.star} ${a.score}</span>`:""}<span class="ep">${a.episodes?"Eps "+a.episodes:esc(a.type||"")}</span></div><p class="views">${I.play} ${kfmt(a.members||0)}</p><h3>${esc(title(a))}</h3></a>`;
const hcard=h=>`<a class="hc" href="#/anime/${h.id}"><div class="th"><img loading="lazy" src="${esc(h.img)}" alt=""><span class="ep">Eps ${esc(h.ep)}</span></div><h3>${esc(h.t)}</h3><p class="views">${I.clock} ${fdate(h.at)}</p></a>`;
const bad=e=>`<p class="msg">Data belum bisa dimuat (${esc(e.message)}). Buka lewat link Vercel atau browser biasa, lalu muat ulang beberapa detik lagi.</p>`;

async function fillGrid(path,my,badge){
  const el=$("#g");
  try{
    const {data}=await api(path);if(my!==rid)return;
    el.innerHTML=uniq(data).map(a=>card(a,badge)).join("")||`<p class="msg">Tidak ada hasil. Coba kata kunci lain.</p>`;
  }catch(e){if(my===rid)el.innerHTML=bad(e)}
}

function home(my){
  const h=ls.get("hist",[]);
  app.innerHTML=(h.length?`<section><div class="sh"><h2>Terakhir Ditonton</h2><a href="#/riwayat">Selengkapnya ›</a></div><div class="hs">${h.slice(0,10).map(hcard).join("")}</div></section>`:"")+
  `<section><div class="sh"><h2>New Anime Update</h2><a href="#/jadwal">Lihat Jadwal ›</a></div><div class="grid" id="g">${skel(9)}</div></section>`;
  fillGrid("/seasons/now?sfw=true&limit=24",my,true);
}
const WK=[["monday","Sen"],["tuesday","Sel"],["wednesday","Rab"],["thursday","Kam"],["friday","Jum"],["saturday","Sab"],["sunday","Min"]];
function jadwal(d,my){
  d=d||["sunday","monday","tuesday","wednesday","thursday","friday","saturday"][new Date().getDay()];
  app.innerHTML=`<section><h2>Jadwal Tayang</h2></section><div class="tabs" style="margin-top:12px">${WK.map(([k,l])=>`<a class="tab${k===d?" on":""}" href="#/jadwal/${k}">${l}</a>`).join("")}</div><section><div class="grid" id="g">${skel(9)}</div></section>`;
  fillGrid(`/schedules?filter=${d}&sfw=true&limit=24`,my);
}
const GN=[[0,"Semua"],[1,"Action"],[2,"Adventure"],[4,"Comedy"],[8,"Drama"],[10,"Fantasy"],[22,"Romance"],[24,"Sci-Fi"],[36,"Slice of Life"],[37,"Supernatural"]];
function jelajah(g,my){
  g=+g||0;
  app.innerHTML=`<section><h2>Jelajah</h2></section><div class="tabs" style="margin-top:12px">${GN.map(([i,l])=>`<a class="tab${i===g?" on":""}" href="#/jelajah/${i}">${l}</a>`).join("")}</div><section><div class="grid" id="g">${skel(9)}</div></section>`;
  fillGrid(g?`/anime?genres=${g}&order_by=score&sort=desc&min_score=7&sfw=true&limit=24`:"/top/anime?sfw=true&limit=24",my);
}
function tren(my){
  app.innerHTML=`<section><div class="sh"><h2>Sedang Tren</h2></div><div class="grid" id="g">${skel(9)}</div></section>`;
  fillGrid("/top/anime?filter=bypopularity&sfw=true&limit=24",my);
}
function cari(q,my){
  app.innerHTML=`<section><div class="sh"><h2>Hasil untuk “${esc(q)}”</h2></div><div class="grid" id="g">${skel(9)}</div></section>`;
  fillGrid(`/anime?q=${encodeURIComponent(q)}&sfw=true&limit=24&order_by=popularity`,my);
}
function riwayat(){
  const h=ls.get("hist",[]);
  app.innerHTML=`<section><div class="sh"><h2>Riwayat Tontonan</h2>${h.length?`<button class="lnk" id="clr">Hapus semua</button>`:""}</div>${h.length?`<div class="grid two">${h.map(hcard).join("").replaceAll('class="hc"','class="card"')}</div>`:`<p class="msg">Belum ada riwayat. Buka sebuah episode dan judulnya akan muncul di sini.</p>`}</section>`;
  $("#clr")?.addEventListener("click",()=>{ls.set("hist",[]);riwayat()});
}

async function detail(id,my){
  app.innerHTML=`<div class="banner"><div class="top"><button class="back" id="bk" aria-label="Kembali">${I.back}</button></div></div><div class="pad"><p class="msg" style="margin-top:20px">Memuat detail…</p></div>`;
  $("#bk").onclick=()=>history.length>1?history.back():location.hash="#/";
  let a;
  try{a=(await api(`/anime/${id}/full`)).data}catch(e){if(my===rid)$(".pad").innerHTML=bad(e);return}
  if(my!==rid)return;cur=a;
  const day=DAYS[a.broadcast?.day],subs=ls.get("subs",[]),on=subs.includes(a.mal_id);
  const tags=[...(a.genres||[]),...(a.themes||[]),...(a.demographics||[])];
  const alt=a.title_english&&a.title_english!==a.title?a.title:(a.title_japanese||"");
  app.innerHTML=`<div class="banner" style="--img:url('${esc(img(a))}')"><div class="top"><button class="back" id="bk" aria-label="Kembali">${I.back}</button><b>Neel.Nime</b></div><div class="bt"><small>${esc(alt)}</small><h1>${esc(title(a))}</h1>${day?`<p class="upd">${I.cal} Update Setiap ${day}</p>`:""}</div></div>
  <div class="pad">
    <div class="chips">${a.score?`<span class="chip">${I.star} ${a.score}</span>`:""}${a.studios?.[0]?`<span class="chip">${esc(a.studios[0].name)}</span>`:""}${a.aired?.string?`<span class="chip">${esc(a.aired.string)}</span>`:""}${a.type?`<span class="chip">${esc(a.type)}</span>`:""}<span class="chip">${kfmt(a.members||0)} members</span></div>
    <div class="chips out">${tags.map(t=>`<span class="chip">${esc(t.name)}</span>`).join("")}</div>
    <div class="btns"><button class="go" id="watch">${I.play} Tonton Sekarang</button><button class="subb${on?" on":""}" id="sub">${I.bell} <span>${on?"Tersubscribe":"Subscribe"}</span></button></div>
    <div class="chips">${a.type?`<span class="chip">${esc(a.type)}</span>`:""}${day?`<span class="chip green">Update Setiap ${day}</span>`:""}</div>
    <div class="sh"><h2>Synopsis</h2><button class="lnk" id="more">Selengkapnya</button></div>
    <p class="syn" id="syn">${esc(a.synopsis||"Sinopsis belum tersedia.")}</p>
    <h2>Related Anime</h2><div class="hs" id="rel"><p class="msg">Memuat…</p></div>
    <h2>Daftar Episode</h2>
    <div class="tb"><input id="eq" type="search" placeholder="Cari episode..." aria-label="Cari episode"><button id="es" aria-label="Urutkan">${I.down}</button><button id="eg" aria-label="Ganti tampilan">${I.grid}</button></div>
    <div class="el" id="el"><p class="msg">Memuat episode…</p></div>
  </div>`;
  $("#bk").onclick=()=>history.length>1?history.back():location.hash="#/";
  $("#watch").onclick=()=>openSheet(a);
  $("#sub").onclick=e=>{const s=ls.get("subs",[]),i=s.indexOf(a.mal_id);i<0?s.push(a.mal_id):s.splice(i,1);ls.set("subs",s);const b=e.currentTarget;b.classList.toggle("on",i<0);b.querySelector("span").textContent=i<0?"Tersubscribe":"Subscribe"};
  $("#more").onclick=e=>{const o=$("#syn").classList.toggle("open");e.currentTarget.textContent=o?"Tutup":"Selengkapnya"};
  est={q:"",desc:true,g:false};eps=[];
  $("#eq").oninput=e=>{est.q=e.target.value;drawEps()};
  $("#es").onclick=e=>{est.desc=!est.desc;e.currentTarget.classList.toggle("asc",!est.desc);drawEps()};
  $("#eg").onclick=e=>{est.g=!est.g;e.currentTarget.innerHTML=est.g?I.list:I.grid;drawEps()};
  loadEps(id,my);
  api(`/anime/${id}/recommendations`).then(r=>{
    if(my!==rid)return;
    const l=r.data.slice(0,12);
    $("#rel").innerHTML=l.length?l.map(x=>`<a class="rc" href="#/anime/${x.entry.mal_id}"><img loading="lazy" src="${esc(x.entry.images?.webp?.large_image_url||x.entry.images?.jpg?.image_url||"")}" alt=""><p>${esc(x.entry.title)}</p></a>`).join(""):`<p class="msg">Belum ada rekomendasi.</p>`;
  }).catch(()=>{if(my===rid)$("#rel").innerHTML=`<p class="msg">Belum bisa dimuat.</p>`});
}
async function loadEps(id,my){
  try{
    let all=[],p=1,more=true;
    while(more&&p<=3){const r=await api(`/anime/${id}/episodes?page=${p}`);all=all.concat(r.data);more=r.pagination?.has_next_page;p++}
    if(my!==rid)return;eps=all;drawEps();
  }catch(e){if(my===rid)$("#el").innerHTML=bad(e)}
}
function drawEps(){
  const el=$("#el");if(!el)return;
  const q=est.q.toLowerCase();
  let l=eps.filter(e=>!q||`episode ${e.mal_id} ${e.title||""}`.toLowerCase().includes(q));
  if(est.desc)l=[...l].reverse();
  el.className="el"+(est.g?" g2":"");
  el.innerHTML=l.length?l.map(e=>`<button class="ei" data-n="${e.mal_id}"><span style="min-width:0"><b>Episode ${e.mal_id}</b><small>${fdate(e.aired)}${e.title?" · "+esc(e.title):""}</small></span><span class="pl">${I.play}</span></button>`).join(""):`<p class="msg">${eps.length?"Episode tidak ditemukan.":"Daftar episode belum tersedia untuk judul ini."}</p>`;
}
document.addEventListener("click",e=>{const b=e.target.closest(".ei");if(b&&cur)openSheet(cur,b.dataset.n)});

function openSheet(a,n){
  if(n){const h=ls.get("hist",[]).filter(x=>x.id!==a.mal_id);h.unshift({id:a.mal_id,t:title(a),img:img(a),ep:n,at:Date.now()});ls.set("hist",h.slice(0,30))}
  const st=(a.streaming||[]).filter(s=>/^https?:\/\//.test(s.url));
  const tr=a.trailer?.embed_url?a.trailer.embed_url.replace("autoplay=1","autoplay=0"):"";
  const yt="https://www.youtube.com/results?search_query="+encodeURIComponent(title(a)+(n?" episode "+n:"")+" official");
  $("#sb").innerHTML=`<div class="stop"><h2>${esc(title(a))}${n?" · Episode "+esc(n):""}</h2><button class="x" id="x" aria-label="Tutup">✕</button></div>
  ${tr?`<div class="vid"><iframe src="${esc(tr)}" title="Trailer ${esc(title(a))}" allowfullscreen loading="lazy"></iframe></div>`:""}
  <p class="note">${st.length?"Tonton di platform resmi (bisa berbeda tiap negara):":"Belum ada platform resmi tercatat untuk judul ini. Coba cari di YouTube atau layanan streaming di negaramu."}</p>
  <div class="links">${st.map(s=>`<a href="${esc(s.url)}" target="_blank" rel="noopener noreferrer">${esc(s.name)}</a>`).join("")}<a class="alt" href="${esc(yt)}" target="_blank" rel="noopener noreferrer">Cari di YouTube</a></div>`;
  $("#x").onclick=()=>$("#sheet").close();
  $("#sheet").showModal();
}
$("#sheet").addEventListener("click",e=>{if(e.target.id==="sheet")e.target.close()});
$("#sheet").addEventListener("close",()=>{$("#sb").innerHTML=""});

const NAV=[["","Home",I.home],["jadwal","Jadwal",I.cal],["jelajah","Jelajah",I.lib],["riwayat","Riwayat",I.hist],["tren","Tren",I.trend]];
$("#nav").innerHTML=NAV.map(([h,l,i])=>`<a href="#/${h}" data-k="${h}" aria-label="${l}">${i}<span>${l}</span></a>`).join("");
$("#sf").addEventListener("submit",e=>{e.preventDefault();const q=$("#q").value.trim();if(q)location.hash="#/cari/"+encodeURIComponent(q)});

function route(){
  const my=++rid,[,r,p]=(location.hash||"#/").slice(1).split("/").map(x=>decodeURIComponent(x));
  document.body.classList.toggle("det",r==="anime");
  const k=["jadwal","jelajah","riwayat","tren"].includes(r)?r:"";
  document.querySelectorAll("#nav a").forEach(a=>a.classList.toggle("on",a.dataset.k===k));
  scrollTo(0,0);
  ({anime:()=>detail(p,my),jadwal:()=>jadwal(p,my),jelajah:()=>jelajah(p,my),riwayat,tren:()=>tren(my),cari:()=>cari(p,my)}[r]||(()=>home(my)))();
}
addEventListener("hashchange",route);route();
</script>
</body>
</html>
